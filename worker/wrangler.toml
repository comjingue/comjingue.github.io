name = "levelup-guild-ask"
main = "src/index.ts"
compatibility_date = "2026-11-01"
compatibility_flags = ["nodejs_compat"]

# 하루 사용량 카운터. `npx wrangler kv namespace create ASK_KV` 로 만든 뒤 나온 id 를 아래에 붙여넣는다.
[[kv_namespaces]]
binding = "ASK_KV"
id = "REPLACE_WITH_KV_ID"

[vars]
ALLOWED_ORIGINS = "https://comjingue.github.io"
DAILY_LIMIT_PER_CODE = "20"
DAILY_LIMIT_TOTAL = "300"
MODEL = "claude-opus-5-5"

# 비밀값(여기 적지 말 것):
#   npx wrangler secret put ANTHROPIC_API_KEY
#   npx wrangler secret put GUILD_CODES      예) lvup-1gi,lvup-staff
