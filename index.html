<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>이진규 (Jin-Gyu Lee)</title>
<meta name="description" content="이진규 (Jin-Gyu Lee), M.D.–Ph.D. Candidate · Physician-Scientist · Frontree CMO. 명함과 이력서.">
<meta property="og:title" content="이진규 (Jin-Gyu Lee)">
<meta property="og:description" content="M.D.–Ph.D. Candidate · Physician-Scientist · Frontree CMO">
<meta property="og:image" content="assets/profile.jpg">
<style>
  :root{
    --green:#0F4C3F;
    --green-2:#0b3a30;
    --orange:#F0703C;
    --cream:#F6F1E7;
    --ink:#1d2a26;
    --muted:#5f6d68;
    --line:#e2dccf;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    font-family:"Pretendard","Inter","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
    color:var(--ink);
    background:var(--cream);
    -webkit-font-smoothing:antialiased;
    display:flex;flex-direction:column;align-items:center;
  }
  a{color:inherit;text-decoration:none;}
  .wrap{
    width:100%;max-width:520px;
    padding:64px 24px 40px;
    flex:1;
    display:flex;flex-direction:column;align-items:center;
  }
  .photo{
    width:112px;height:112px;border-radius:50%;
    object-fit:cover;object-position:center 18%;
    border:3px solid #fff;
    box-shadow:0 8px 24px rgba(15,76,63,.18);
  }
  h1{margin:22px 0 0;font-size:2rem;letter-spacing:-.02em;font-weight:700;}
  .en{margin-top:2px;color:var(--muted);font-size:1rem;}
  .role{
    margin-top:16px;text-align:center;
    font-size:.95rem;line-height:1.6;color:#3d4a45;
  }
  .role .dot{color:var(--orange);margin:0 6px;}

  .choices{
    width:100%;margin-top:40px;
    display:grid;gap:14px;
  }
  .choice{
    display:flex;align-items:center;gap:18px;
    padding:22px 22px;
    border-radius:16px;
    background:#fff;
    border:1px solid var(--line);
    transition:transform .16s ease, box-shadow .16s ease, border-color .16s ease;
  }
  .choice:hover,.choice:focus-visible{
    transform:translateY(-2px);
    box-shadow:0 10px 26px rgba(15,76,63,.12);
    border-color:var(--green);
    outline:none;
  }
  .choice.primary{background:var(--green);border-color:var(--green);color:#fff;}
  .choice.primary .sub{color:rgba(255,255,255,.72);}
  .ico{
    width:48px;height:48px;flex-shrink:0;border-radius:12px;
    display:flex;align-items:center;justify-content:center;
    background:var(--cream);
  }
  .choice.primary .ico{background:rgba(255,255,255,.1);}
  .ico svg{width:24px;height:24px;}
  .txt{flex:1;min-width:0;}
  .ttl{font-size:1.12rem;font-weight:700;}
  .sub{margin-top:2px;font-size:.86rem;color:var(--muted);}
  .arrow{font-size:1.3rem;color:var(--orange);}

  .links{
    margin-top:34px;
    display:flex;flex-wrap:wrap;justify-content:center;gap:8px 18px;
    font-size:.88rem;color:var(--muted);
  }
  .links a{border-bottom:1px solid transparent;}
  .links a:hover{color:var(--green);border-color:var(--green);}
  footer{padding:24px;font-size:.78rem;color:#8b968f;}
</style>
</head>
<body>

<main class="wrap">
  <img class="photo" src="assets/profile.jpg" alt="이진규 프로필 사진">
  <h1>이진규</h1>
  <div class="en">Jin-Gyu Lee, M.D.</div>
  <div class="role">
    M.D.–Ph.D. Candidate<span class="dot">·</span>Physician-Scientist<br>
    Frontree CMO<span class="dot">·</span>서울대학교 바이오엔지니어링
  </div>

  <nav class="choices" aria-label="페이지 선택">
    <a class="choice primary" href="card.html">
      <span class="ico" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="#F0703C" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="5" width="19" height="14" rx="2.5"/><circle cx="8.5" cy="11" r="2.2"/><path d="M5.5 16c.6-1.6 1.7-2.4 3-2.4s2.4.8 3 2.4"/><path d="M14 10h4.5M14 13.5h3"/></svg>
      </span>
      <span class="txt">
        <span class="ttl">명함</span>
        <span class="sub" style="display:block">프론트리 · 서울대학교</span>
      </span>
      <span class="arrow" aria-hidden="true">→</span>
    </a>
    <a class="choice" href="cv.html">
      <span class="ico" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="#0F4C3F" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2.8h8.5L19 7.3V20a1.2 1.2 0 0 1-1.2 1.2H6A1.2 1.2 0 0 1 4.8 20V4A1.2 1.2 0 0 1 6 2.8z"/><path d="M14.3 2.8v4.6H19"/><path d="M8 12h8M8 15.5h8M8 8.5h3"/></svg>
      </span>
      <span class="txt">
        <span class="ttl">이력서</span>
        <span class="sub" style="display:block">Curriculum Vitae</span>
      </span>
      <span class="arrow" aria-hidden="true">→</span>
    </a>
  </nav>

  <div class="links">
    <a href="mailto:comjingue@gmail.com">Email</a>
    <a href="https://frontree.io" target="_blank" rel="noopener">frontree.io</a>
    <a href="https://www.instagram.com/jingyulee___/" target="_blank" rel="noopener">Instagram</a>
  </div>
</main>

<footer>© 2026 Jin-Gyu Lee</footer>

</body>
</html>
