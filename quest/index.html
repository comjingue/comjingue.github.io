<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>레벨업 길드 · 초보자 퀘스트 맵</title>
<meta name="description" content="AI 에이전트 팀 만들기와 재테크 설계를 RPG 퀘스트로. 설치부터 첫 동료 소환까지 따라오면 됩니다.">
<meta property="og:title" content="레벨업 길드 · 초보자 퀘스트 맵">
<meta property="og:description" content="개발 환경 세팅부터 나만의 AI 에이전트 팀, 재테크 설계까지 퀘스트로 깨기">
<meta name="theme-color" content="#14201c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="레벨업 길드">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preload" href="fonts/Galmuri11-sub.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/Galmuri11-Bold-sub.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="style.css">
<script defer src="config.js"></script>
<script defer src="data.js"></script>
<script defer src="sfx.js"></script>
<script defer src="app.js"></script>
<script defer src="ask.js"></script>
</head>
<body>

<!-- 타이틀 -->
<section id="title" class="hidden" aria-label="타이틀">
  <i class="star" style="left:14%;top:16%"></i><i class="star b" style="left:78%;top:12%;animation-delay:.4s"></i>
  <i class="star" style="left:86%;top:44%;animation-delay:.8s"></i><i class="star b" style="left:9%;top:62%;animation-delay:.6s"></i>
  <h1 class="logo">레벨업 길드</h1>
  <p class="subtitle">퀘스트를 깰 때마다 AI 동료가 출근하고, 내 돈의 지도가 그려진다.</p>
  <div class="hero-big" id="titleHero"></div>
  <div class="tap" id="tapStart">TAP TO START</div>
  <div class="title-actions hidden" id="titleActions">
    <button class="btn" id="continueBtn">이어하기 ▶</button>
    <button class="btn ghost" id="newBtn">새로 시작</button>
  </div>
  <div class="season">SEASON 1</div>
</section>

<!-- 캐릭터 생성 -->
<section id="wizard" class="hidden" aria-label="캐릭터 생성">
  <div class="wz-top">
    <button class="iconbtn" id="wzBack" aria-label="뒤로"></button>
    <div class="dots" id="wzDots"><i></i><i></i><i></i></div>
    <div style="width:44px"></div>
  </div>
  <div id="wzBody"></div>
  <button class="btn cta-fixed" id="wzNext">다음 ▶</button>
</section>

<!-- 메인 -->
<section id="app" class="hidden">
  <header class="hud">
    <div class="hud-in">
      <div class="avatar" id="hudAvatar"></div>
      <div class="meta">
        <div class="l1"><span class="name" id="hudName"></span><span class="day" id="hudDay"></span></div>
        <div class="cls" id="hudCls"></div>
        <div class="bar"><i id="xpBar"></i><span id="xpTxt" class="px"></span></div>
      </div>
      <div class="lvb" id="hudLv">Lv.1</div>
      <button class="iconbtn" id="menuBtn" aria-label="메뉴"></button>
    </div>
  </header>
  <main id="view"></main>
  <button class="btn gold next-cta hidden" id="nextCta"></button>
  <nav class="tabbar"><div class="tabbar-in" id="tabbar"></div></nav>
</section>

<div id="scrim"></div>
<section class="sheet" id="qSheet" role="dialog" aria-modal="true" aria-label="퀘스트">
  <div class="grab"><div class="handle"></div></div>
  <div class="sh-body" id="qBody"></div>
  <div class="sh-bar" id="qBar"></div>
</section>
<section class="sheet" id="menuSheet" role="dialog" aria-modal="true" aria-label="메뉴">
  <div class="grab"><div class="handle"></div></div>
  <div class="sh-body" id="menuBody"></div>
</section>
<section class="sheet" id="askSheet" role="dialog" aria-modal="true" aria-label="길드 마스터에게 묻기">
  <div class="grab"><div class="handle"></div></div>
  <div class="sh-body" id="askBody"></div>
  <div class="ask-input" id="askInput">
    <div class="ask-pv" id="askPreview"></div>
    <div class="ask-row">
      <button class="iconbtn" id="askCam" aria-label="사진 찍기 또는 첨부"></button>
      <input type="file" id="askFile" accept="image/*" capture="environment" hidden>
      <input type="text" id="askText" placeholder="무엇이 막혔나요?" autocomplete="off" enterkeyhint="send" maxlength="1000">
      <button class="btn mint" id="askSend">보내기</button>
    </div>
    <div class="ask-foot"><span id="askLeft" class="px"></span><span>사진은 Claude API로 전송돼요 · 민감정보는 가리고 찍기</span></div>
  </div>
</section>
<div class="card-layer" id="resultCard" role="dialog" aria-modal="true"></div>
<div class="card-layer jobup" id="jobCard" role="dialog" aria-modal="true"></div>
<div id="fx"></div>
<div id="toast" role="status" aria-live="polite"></div>
<noscript><p style="padding:20px">이 페이지는 JavaScript가 필요합니다.</p></noscript>
</body>
</html>
